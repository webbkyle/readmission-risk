name: monthly-retrain

# Monthly champion/challenger retraining. Simulates new arrivals by generating
# a fresh synthetic cohort (new Synthea seed), retrains, promotes only on a
# frozen-holdout gate, pushes the winner to Hugging Face Spaces, and commits
# the updated metrics.json (the write-up's live status feed).
on:
  schedule:
    - cron: '0 9 1 * *'  # 09:00 UTC on the 1st of each month
  workflow_dispatch:      # manual trigger for demos

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (Synthea)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Download Synthea
        run: |
          curl -L -o /tmp/synthea.jar \
            https://github.com/synthetichealth/synthea/releases/download/master-branch-latest/synthea-with-dependencies.jar

      - name: Generate new cohort (fresh seed = simulated arrivals)
        run: |
          mkdir -p data/synthea-new
          java -jar /tmp/synthea.jar -p 300 -s ${{ github.run_number }} \
            --exporter.baseDirectory=data/synthea-new \
            --exporter.fhir.export=true
          ls data/synthea-new/fhir | wc -l

      - name: Run monthly loop
        run: python scripts/monthly_run.py --new-bundles data/synthea-new/fhir --version v$(date +%Y-%m)

      - name: Push promoted model to Hugging Face Spaces
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os
          # upload the current champion artifact to the Space
          from huggingface_hub import HfApi
          status = json.load(open('data/metrics.json'))
          ver = status['champion_version']
          api = HfApi(token=os.environ['HF_TOKEN'])
          for f in [f'models/model_{ver}.pkl', f'models/model_{ver}.card.json']:
              api.upload_file(path_or_fileobj=f,
                              path_in_repo=os.path.basename(f),
                              repo_id='k-webb/readmission-risk',
                              repo_type='space')
          print('pushed', ver, 'to Space')
          EOF

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json data/features.parquet runs/ models/
          git diff --cached --quiet || git commit -m "monthly run $(date +%Y-%m): $(python -c "import json;print(json.load(open('data/metrics.json'))['last_outcome'])")"
          git push
