name: weekly-retrain

# Weekly champion/challenger retraining. Simulates new arrivals by generating
# a fresh synthetic cohort (new Synthea seed), retrains, promotes only on a
# frozen-holdout gate, rebuilds the static Space (in-browser ONNX demo),
# pushes it to Hugging Face, and commits the updated metrics.json (the
# write-up's live status feed).
on:
  schedule:
    - cron: '0 9 * * 1'  # 09:00 UTC every Monday
  workflow_dispatch:      # manual trigger for demos

permissions:
  contents: write  # the bot commits metrics/models back to the repo

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (Synthea)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install -r requirements.txt

      - name: Download Synthea
        run: |
          curl -L -o /tmp/synthea.jar \
            https://github.com/synthetichealth/synthea/releases/download/master-branch-latest/synthea-with-dependencies.jar

      - name: Generate new cohort (fresh seed = simulated arrivals)
        run: |
          mkdir -p data/synthea-new
          java -jar /tmp/synthea.jar -p 500 -s ${{ github.run_number }} \
            --exporter.baseDirectory=data/synthea-new \
            --exporter.fhir.export=true
          ls data/synthea-new/fhir | wc -l

      - name: Run weekly loop
        # version includes the run number: two runs on the same day (e.g. a
        # manual re-run) must not share a version string
        run: python scripts/weekly_run.py --new-bundles data/synthea-new/fhir --version v$(date +%Y-%m-%d)-r${{ github.run_number }} --min-new-patients 75

      - name: Rebuild static Space assets
        run: |
          python -m pip install -q onnxmltools onnx onnxruntime huggingface_hub
          VER=$(python -c "import json; print(json.load(open('data/metrics.json'))['champion_version'])")
          python scripts/build_space.py --version $VER
          echo "space rebuilt for champion $VER"

      - name: Push Space to Hugging Face
        if: success()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import json, os
          from huggingface_hub import HfApi
          status = json.load(open('data/metrics.json'))
          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_folder(
              folder_path='space',
              repo_id='k-webb/readmission-risk',
              repo_type='space',
              commit_message='weekly run %s: champion %s' % (
                  status['last_run'], status['champion_version']),
          )
          print('space updated')
          EOF

      - name: Commit updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/metrics.json data/features.parquet runs/ models/ space/
          git diff --cached --quiet || git commit -m "weekly run $(date +%Y-%m-%d): $(python -c "import json;print(json.load(open('data/metrics.json'))['last_outcome'])")"
          git push
